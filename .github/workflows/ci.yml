name: CI

# Pushes to any branch run the unit tests. Pushes to master (a merged pull request) also run the integration tests,
# as a separate job in parallel: the Testcontainers classes tagged "container", enabled by the container-tests profile.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch supersedes the running build; every master build runs to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check llms-full.txt matches the guide
        run: docs/guide/build-llms-full.sh && git diff --exit-code llms-full.txt

      - name: Build and run unit tests
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  integration-tests:
    name: Integration tests
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the runner's Docker daemon (postgres:16-alpine). Only the classes tagged "container" run;
      # the unit tests are the other job's.
      - name: Build and run integration tests
        run: mvn -B -ntp -Pcontainer-tests -Dgroups=container clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
