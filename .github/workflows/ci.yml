name: CI

# Pushes to any branch run the unit tests and, as a separate job in parallel, the integration tests: the
# Testcontainers classes tagged "container", enabled by the container-tests profile.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch supersedes the running build; every master build runs to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Fails fast, before compiling or testing. Fix locally with: mvn spotless:apply
      - name: Check google-java-format
        run: mvn -B -ntp spotless:check

  unit-tests:
    name: Unit tests (JDK ${{ matrix.java }})
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 21 is the compile baseline (maven.compiler.release); 25 (LTS) guards forward compatibility.
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Check llms-full.txt matches the guide
        run: docs/guide/build-llms-full.sh && git diff --exit-code llms-full.txt

      - name: Build and run unit tests
        run: mvn -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-jdk${{ matrix.java }}
          path: "**/target/surefire-reports/"
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers uses the runner's Docker daemon (postgres:16-alpine). Only the classes tagged "container" run;
      # the unit tests are the other job's.
      - name: Build and run integration tests
        run: mvn -B -ntp -Pcontainer-tests -Dgroups=container clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
