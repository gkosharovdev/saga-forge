name: Docs

# Builds the user guide (docs/guide) with MkDocs Material on every push that touches it, in strict mode, so broken
# links fail the branch. Pushes to master also publish the site to GitHub Pages; the repository's Pages source must be
# set to "GitHub Actions" (Settings > Pages).
on:
  push:
    branches: ["**"]
    paths:
      - "docs/guide/**"
      - "docs/site-hooks/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.6.14"

      - name: Build
        run: mkdocs build --strict -d site

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
