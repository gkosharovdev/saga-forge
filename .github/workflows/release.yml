name: Release

# Pushing a tag vX.Y.Z publishes version X.Y.Z of Saga Forge to Maven Central through the Sonatype Central Portal
# (README "Releasing"). The version comes from the tag; master stays on X.Y.Z-SNAPSHOT. The full build, container
# suites included, runs before anything is uploaded.
#
# Secrets: CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD (a Central Portal user token), GPG_PRIVATE_KEY (armored)
# and GPG_PASSPHRASE. Repository variable CENTRAL_AUTO_PUBLISH: "true" publishes a validated deployment without the
# manual "Publish" step in the portal (default "false").
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-qualifier]" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21, Central credentials and the signing key
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set the release version
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      # Testcontainers uses the runner's Docker daemon (postgres:16-alpine).
      - name: Build, test, sign and publish
        run: >-
          mvn -B -ntp -P release,container-tests deploy
          -Dcentral.autoPublish=${{ vars.CENTRAL_AUTO_PUBLISH || 'false' }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Saga Forge ${{ steps.version.outputs.version }}" --generate-notes --verify-tag
