# The user guide as a site (GitHub Pages, built by .github/workflows/docs.yml). Pages are docs/guide/*.md, unchanged;
# links leaving docs/guide are pointed at GitHub by docs/site-hooks/repo_links.py.
site_name: Saga Forge
site_description: Declarative, annotation-driven saga orchestration for Java 21 and Spring Boot
site_url: https://gkosharovdev.github.io/saga-forge/
repo_url: https://github.com/gkosharovdev/saga-forge
repo_name: gkosharovdev/saga-forge
edit_uri: edit/master/docs/guide/
docs_dir: docs/guide
exclude_docs: |
  build-llms-full.sh
hooks:
  - docs/site-hooks/repo_links.py
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
nav:
  - Overview: README.md
  - Getting started: getting-started.md
  - Model reference: model-reference.md
  - Validation rules: validation-rules.md
  - Recipes: recipes.md
  - Testing: testing.md
  - Operations: operations.md
  - Limitations: limitations.md
  - Javadoc: https://javadoc.io/doc/io.github.gkosharovdev/saga-forge-core
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
validation:
  links:
    not_found: warn
    anchors: warn
