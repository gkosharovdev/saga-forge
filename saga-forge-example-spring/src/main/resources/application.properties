spring.application.name=order-example

# The application's own database; Saga Forge stores its sagas, context values and messages in it too.
spring.datasource.url=${ORDERS_DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${ORDERS_DB_USER:orders}
spring.datasource.password=${ORDERS_DB_PASSWORD:orders}

# The example's own table.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-orders.sql

# Development convenience: create Saga Forge's tables on an empty database. Production schemas belong in Flyway or
# Liquibase, applying saga-forge-storage-postgres's schema.sql and upgrade scripts.
saga-forge.storage.postgres.initialize-schema=always
